name: Test and package Bitmerger

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest pytest-qt
      - name: Run unit and GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q && python -m unittest discover -s tests -v
      - name: Compile all application modules
        run: python -m compileall -q bitmerger tests

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller
      - name: Build standalone app
        run: python build.py
      - name: Verify package artifact
        run: test -f dist/Bitmerger/Bitmerger
