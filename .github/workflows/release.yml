name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app
        run: python build.py

      - name: Package app
        run: |
          cd dist
          zip -r Bitmerger-macos.zip Bitmerger.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bitmerger-macos
          path: dist/Bitmerger-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app
        run: python build.py

      - name: Package app
        run: |
          cd dist
          Compress-Archive -Path Bitmerger -DestinationPath Bitmerger-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bitmerger-windows
          path: dist/Bitmerger-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app
        run: python build.py

      - name: Package app
        run: |
          cd dist
          tar czf Bitmerger-linux.tar.gz Bitmerger

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bitmerger-linux
          path: dist/Bitmerger-linux.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create Release
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/Bitmerger-macos/Bitmerger-macos.zip \
            artifacts/Bitmerger-windows/Bitmerger-windows.zip \
            artifacts/Bitmerger-linux/Bitmerger-linux.tar.gz \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
